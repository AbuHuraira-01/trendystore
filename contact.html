    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Toggle menu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>

<div class="page-title">
  <div class="container">
    <h1>Contact Us</h1>
  </div>
</div>

<div class="container my-5">
  <div class="row">
    <div class="col-md-7 mb-4">
      <h3>Send us a message</h3>
      <form>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="Enter your name">
        </div>
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
        <div class="mb-3">
          <label class="form-label">Message</label>
          <textarea class="form-control" rows="5" placeholder="Write your message"></textarea>
        </div>
        <button type="submit" class="btn btn-dark">Send Message</button>
      </form>
    </div>
    <div class="col-md-5">
      <div class="info-box text-start">
        <h3>Our Info</h3>
        <p><b>Address:</b> Shahrah-e-Faisal, Karachi</p>
        <p><b>Phone:</b> 0300-1234567</p>
        <p><b>Email:</b> info@trendystore.com</p>
        <p><b>Timing:</b> Mon - Sat, 10am to 8pm</p>
      </div>
    </div>
  </div>
</div>
